# Supabase/PostgreSQL profile: activate with SPRING_PROFILES_ACTIVE=supabase or combine with render.
# Uses Supabase's Postgres/Supavisor pooler over SSL.
spring.datasource.url=${SUPABASE_JDBC_URL:jdbc:postgresql://${SUPABASE_DB_HOST:${PGHOST:localhost}}:${SUPABASE_DB_PORT:${PGPORT:5432}}/${SUPABASE_DB_NAME:${PGDATABASE:postgres}}?sslmode=${SUPABASE_DB_SSLMODE:require}&prepareThreshold=0}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:${PGUSER:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
